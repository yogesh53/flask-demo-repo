name: PR test 
on:
  pull_request:
     branches:
       - main
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
         python-version: "3.12"
      - name: Install dependencies
        run: | 
          python -m pip install --upgrade pip
          pip install -r apps/requirements.txt
          pip install pytest
      - name: Run tests
        run: | 
          python -m pytest -v