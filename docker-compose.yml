services:
  postgres:
    image: postgres:16
    container_name: assignment-container
    environment: 
      POSTGRES_DB: messagesdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d messagesdb"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  flask:
    image: flask-image:v1
    container_name: flask-container
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: messagesdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
    ports:
      - "5000:5000"
    depends_on:
      postgres:
         condition: service_healthy 
volumes:
  postgres_data:
  